8px}.fallback-ribbon{position:absolute;top:21%;left:-15%;width:130%;height:42px;background:linear-gradient(#fffcf4,#d5cbbb);box-shadow:0 35px 40px #77695622;transform:rotate(14deg)}.fallback-ribbon.second{top:72%;transform:rotate(-17deg)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<section id="cover" aria-label="초대장 첫 화면"><div class="fallback-ribbon" aria-hidden="true"></div><div class="fallback-ribbon second" aria-hidden="true"></div><div class="meta"><span>A PERSONAL INVITATION</span><span>27 FEB 2027</span></div><div class="copy"><small>THE BEGINNING OF US</small><h1>함께 맞는, 봄.</h1><p>우리의 시작에 당신을 초대합니다.</p></div><button id="enter">초대장 열기 <span>↗</span></button><div id="hint">YOUNGSUN · EUNJI</div></section>
<main id="inside" hidden><header><span>OUR FIRST SPRING</span><button id="replay">다시 보기 ↺</button></header><h2 tabindex="-1">함께 맞는, 봄.</h2><p>윤영선 · 이은지<br>2027년 2월 27일 토요일 오후 5시 30분<br>크레스트72 글라스 홀</p><a href="./index.html#invitation">청첩장 내용 보기 ↗</a></main>
<script type="module">
const cover=document.querySelector('#cover'),inside=document.querySelector('#inside'),enter=document.querySelector('#enter');
const reduce=matchMedia('(prefers-reduced-motion: reduce)');let openingAt=null,raf=0,renderer,animate;let timer;
function complete(){cancelAnimationFrame(raf);location.replace('./index.html#invitation')}

document.querySelector('#replay').onclick=()=>{clearTimeout(timer);openingAt=null;cover.hidden=false;cover.style.opacity='1';cover.classList.remove('departing');inside.hidden=true;enter.disabled=false;window.scrollTo(0,0);if(animate){cancelAnimationFrame(raf);animate(performance.now())}enter.focus()};
try{
let THREE;try{THREE=await import('./three.module.min.js')}catch{THREE=await import('./vendor/three/three.module.min.js')}

const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,40);camera.position.z=9;
scene.add(new THREE.HemisphereLight(0xffffff,0xc7bdae,1.5));const key=new THREE.DirectionalLight(0xfff8ea,3.6);key.position.set(-3,6,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-7,right:7,top:10,bottom:-10});key.shadow.bias=-.0005;key.shadow.normalBias=.015;key.shadow.radius=9;key.shadow.blurSamples=12;scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1);fill.position.set(4,0,5);scene.add(fill);

// Shallow wall planes catch the light, without literal columns or a door frame.

const bands=[];let H=5;
function band(n){const seg=180,geo=new THREE.BufferGeometry(),p=new Float32Array((seg+1)*2*3),uv=new Float32Array((seg+1)*4),ix=[];for(let i=0;i<=seg;i++){uv.set([i/seg,0,i/seg,1],i*4);if(i<seg){let a=i*2;ix.push(a,a+2,a+1,a+1,a+2,a+3)}}geo.setAttribute('position',new THREE.BufferAttribute(p,3));geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));geo.setIndex(ix);const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,side:THREE.DoubleSide,roughness:.76,metalness:.02}));mesh.castShadow=true;mesh.receiveShadow=true;mesh.frustumCulled=false;scene.add(mesh);bands.push(mesh)}band(0);band(1);

let px=0,py=0,vx=0,vy=0;cover.addEventListener('pointermove',e=>{px=(e.clientX/innerWidth-.5)*.16;py=(e.clientY/innerHeight-.5)*.08},{passive:true});
const point=new THREE.Vector3(),tangent=new THREE.Vector3(),side=new THREE.Vector3();const smooth=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};
animate=now=>{if(cover.hidden)return;let t=reduce.matches?0:now*.00018,q=openingAt===null?0:Math.min(1,(now-openingAt)/2200),travel=smooth((q-.13)/.87);vx+=(px-vx)*.04;vy+=(py-vy)*.04;camera.position.set(vx,-vy,9-travel*6.5);camera.lookAt(0,0,-3);

}catch(e){console.warn('Static opening fallback',e)}
</script></body></html>
