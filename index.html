<style>
/* Concept A: preserve the approved composition at every viewport size. */
#invitation-opening{position:fixed;inset:0;z-index:2;overflow:hidden;background:#efede8;font-family:"Noto Serif KR",serif;color:#34333b;max-width:none;transform:none!important;clip-path:none!important}
#invitation-opening[hidden]{display:none!important}
.entrance-frame{position:relative;width:min(100%,calc(100svh * .5));height:100svh;margin:auto;overflow:hidden;background:#fafaf9;isolation:isolate;container-type:size}
.entrance-scene{z-index:0;position:absolute;inset:0;transform-origin:49% 43%;transition:transform 2.2s cubic-bezier(.55,0,.2,1),opacity .8s 1.45s;will-change:transform}
.entrance-scene svg,.entrance-scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ribbon-layer{position:absolute;inset:0;z-index:1;overflow:hidden}.entrance-scene .room-occluder{z-index:2;clip-path:polygon(24% 24%,59% 23.4%,73% 33%,73% 61%,40% 61%,24% 51%)}
/* Satin artwork retains its original color. The two exposed folds share
   one material path and phase; the central architectural plate never moves. */
.satin-upper{transform-origin:760px 590px;animation:satin-upper-breathe 14s ease-in-out infinite}
.satin-lower{transform-origin:230px 1110px;animation:satin-lower-breathe 14s ease-in-out infinite}
@keyframes satin-upper-breathe{0%,100%{transform:translate(0,-2px) rotate(-.25deg)}50%{transform:translate(-3px,3px) rotate(.25deg)}}
@keyframes satin-lower-breathe{0%,100%{transform:translate(0,-2px) rotate(.25deg)}50%{transform:translate(3px,3px) rotate(-.25deg)}}
#invitation-opening[hidden] .satin-upper,#invitation-opening[hidden] .satin-lower{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.satin-upper,.satin-lower{animation:none!important}.satin-lower{transform:translateY(0)}}
/* Mobile-first: copy and action share the doorway's center, in frame units. */
#invitation-opening .copy{z-index:3;position:absolute;top:42%;left:25%;width:47%;transform:translateY(-50%);text-align:center;transition:opacity .45s,transform .65s}
#invitation-opening .copy h1{font-family:inherit;font-size:5.1cqw;font-weight:400;letter-spacing:-.035em;margin:0;line-height:1.6;white-space:nowrap}
#open-invitation{z-index:3;position:relative;bottom:auto;left:auto;transform:none;width:25cqw;min-height:44px;margin:3cqh auto 0;padding:8px 0;border:0;border-bottom:1px solid #aaa49d;background:transparent;color:#393840;font-family:inherit;font-size:2.8cqw;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:opacity .3s}
#open-invitation:focus-visible{outline:1px solid #777;outline-offset:7px}
#invitation-opening.departing .entrance-scene{transform:scale(3.6);opacity:0}
#invitation-opening.departing .copy{opacity:0;transform:translateY(calc(-50% - 8px))}
#invitation-opening.departing #open-invitation{opacity:0;pointer-events:none}

@media(prefers-reduced-motion:reduce){.entrance-scene,#invitation-opening .copy,#open-invitation{transition:none!important}}
#entrance-music-toggle{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:block;min-width:88px;min-height:44px;margin-top:4px;padding:10px 8px;border:0;border-radius:0;background:transparent;color:#77736d;font-family:inherit;font-size:clamp(10px,2.65cqw,12px);font-weight:400;letter-spacing:.04em;white-space:nowrap;cursor:pointer}#entrance-music-toggle[hidden]{display:none}#entrance-music-toggle:focus-visible{outline:1px solid #aaa49d;outline-offset:0}
.music-credit{font-size:10px;line-height:1.9;color:#777;margin:28px auto 0;letter-spacing:0}.music-credit a{color:inherit;text-underline-offset:3px}
</style>
<style>
#open-invitation{width:32cqw;max-width:154px;min-width:116px;min-height:42px;margin:3cqh auto 0;padding:11px 18px;border:1px solid rgba(95,90,82,.25);border-radius:999px;background:rgba(255,255,255,.18);color:#58534e;justify-content:center;font-size:clamp(11px,2.7cqw,13px);line-height:1.4;letter-spacing:.08em;transition:background .2s,border-color .2s,opacity .3s}
#open-invitation:hover{background:rgba(255,255,255,.48);border-color:rgba(95,90,82,.45)}
#open-invitation:active{background:rgba(218,214,208,.25)}
/* A quiet secondary control, aligned with the invitation's serif typography. */
#entrance-music-toggle{position:relative;top:auto;left:auto;transform:none;display:flex;align-items:center;justify-content:center;gap:7px;width:max-content;min-width:100px;min-height:44px;margin:10px auto -54px;padding:8px 10px;color:#6e6a65;font-size:clamp(10px,2.6cqw,12px);letter-spacing:.045em;line-height:1.5;transition:color .2s}
#entrance-music-toggle:hover,#entrance-music-toggle[aria-pressed="true"]{color:#373431}
.sound-mark{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;flex:none}
[aria-pressed="false"] .sound-waves,[aria-pressed="true"] .sound-off{display:none}
.quick-nav>.music-toggle{color:#6e6a65;font-size:19px}
.quick-nav>.music-toggle[aria-pressed="true"]{color:#373431}
.quick-nav.has-music{grid-template-columns:1fr 1fr 1.2fr 64px}
.quick-nav>.music-toggle{display:flex;flex-direction:row;gap:0;align-items:center;justify-content:center;min-height:44px;font:inherit;font-size:11px;line-height:normal;color:inherit}
.quick-nav>.music-toggle:after{display:none}
.quick-nav>.music-toggle>.nav-music-label{font:inherit;font-size:11px;letter-spacing:inherit}.quick-nav>.music-toggle>.sound-mark{display:none}
html,body{touch-action:pan-x pan-y}

/* One quiet action line; no pill, filled surface or decorative arrow. */
.entrance-actions{display:flex;align-items:center;justify-content:center;margin:3cqh auto 0;width:max-content;max-width:100%}
#open-invitation{width:auto;max-width:none;min-width:0;min-height:44px;margin:0;padding:10px 13px 10px 0;border:0;border-radius:0;background:none;color:#5b5652;font-size:clamp(11px,2.75cqw,13px);letter-spacing:.06em;line-height:1.6}
#open-invitation:hover,#open-invitation:active{background:none;color:#292624}
#entrance-music-toggle{width:38px;min-width:38px;min-height:44px;margin:0;padding:10px 0 10px 12px;position:relative;color:#7b7670}
#entrance-music-toggle:before{content:"";position:absolute;left:0;top:16px;height:12px;width:1px;background:rgba(95,90,82,.22)}
#entrance-music-toggle .music-label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#open-invitation{padding:10px 12px}
</style></head>
